<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fc" />
  <title>拾光・行事曆</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="calendar.css" />
  <link rel="stylesheet" href="calendar-ui.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#calendar" aria-label="行事曆首頁"><span class="brand-icon">✳</span><span>拾光<span class="brand-dot">.</span></span></a>
      <div class="account-card" id="account-card">
        <div class="account-avatar" id="account-avatar">✳</div>
        <div class="account-copy"><strong id="account-name">尚未登入</strong><span id="account-status">登入以同步行程</span></div>
        <button id="auth-button" class="auth-button" type="button">Google 登入</button>
      </div>
      <p class="nav-label">工作空間</p>
      <nav class="main-nav" aria-label="主要導覽">
        <a class="nav-item active" href="#calendar"><span class="nav-icon">▦</span>行事曆</a>
        <a class="nav-item" href="#tasks"><span class="nav-icon">◷</span>待辦事項<span class="nav-count" id="nav-todo-count">0</span></a>
        <a class="nav-item" href="#add-event"><span class="nav-icon">＋</span>新增行程</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb">我的工作空間 <span>/</span> <strong>行事曆</strong></div>
        <div class="top-actions"><span class="date-chip" id="header-date"></span><button class="icon-button" id="theme-toggle" aria-label="切換深色模式" title="切換深色模式">☼</button></div>
      </header>
      <div class="dashboard">
        <section class="welcome-row">
          <div>
            <div class="eyebrow"><span class="live-dot"></span>行程規劃</div>
            <div class="workspace-title-row"><h1><button id="workspace-title" class="workspace-title-button" type="button" aria-label="點選以修改行事曆名稱">我的行事曆</button></h1></div>
            <p class="welcome-subtitle"><strong id="today-date"></strong>　<span id="day-name"></span></p>
          </div>
        </section>

        <div class="content-grid">
          <section class="panel schedule-panel calendar-panel" id="calendar" aria-label="行事曆">
            <div class="panel-heading calendar-heading">
              <div><div class="section-kicker">CALENDAR</div><h2 id="calendar-month-label"></h2></div>
              <div class="calendar-controls">
                <button class="date-nav-button" id="previous-month" type="button" aria-label="上個月">‹</button>
                <button class="today-button" id="go-today" type="button">今天</button>
                <button class="date-nav-button" id="next-month" type="button" aria-label="下個月">›</button>
              </div>
            </div>
            <div class="calendar-weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
            <div class="calendar-grid" id="calendar-grid" role="grid" aria-label="月曆"></div>
            <section class="day-agenda" aria-labelledby="selected-day-label">
              <div class="agenda-heading"><h3 id="selected-day-label">選取日期的行程</h3><span id="agenda-count" class="heading-count">0</span></div>
              <div class="timeline" id="timeline"></div>
            </section>
          </section>

          <aside class="right-column">
            <section class="panel tasks-panel" id="tasks">
              <div class="panel-heading task-heading"><div><div class="section-kicker">UPCOMING EVENTS</div><h2>待辦事項 <span class="heading-count" id="todo-count">0</span></h2></div></div>
              <div class="task-list" id="task-list"></div>
              <div class="task-progress"><div class="progress-label"><span>行程完成度</span><strong id="progress-text">0 / 0</strong></div><div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div></div>
            </section>
          </aside>
        </div>

        <section class="panel add-event-panel" id="add-event" aria-labelledby="add-event-heading">
          <div class="panel-heading"><div><div class="section-kicker">YOUR PLAN</div><h2 id="add-event-heading">新增行程</h2></div><span class="stat-icon lilac">＋</span></div>
          <form id="event-form" class="event-form">
            <label class="plan-type-field">計畫類型
              <select name="planType" id="plan-type">
                <option value="daily">每日行程</option>
                <option value="monthly">月計畫</option>
                <option value="yearly">年度計畫</option>
              </select>
            </label>
            <label>標題<input name="title" id="plan-title" required maxlength="60" placeholder="輸入行程名稱"></label>
            <label class="date-field daily-field">日期（年／月／日）<input name="date" id="daily-date" type="date" required></label>
            <label class="date-field monthly-field" hidden>選擇月份<input name="month" id="plan-month" type="month" required></label>
            <label class="date-field yearly-field" hidden>選擇年份<input name="year" id="plan-year" type="number" min="1900" max="2100" step="1" required placeholder="例如 2026"></label>
            <div class="form-row daily-time-fields daily-field">
              <label>開始時間（選填）<input name="start" id="plan-start" type="time"></label>
              <label>結束時間（選填）<input name="end" id="plan-end" type="time"></label>
            </div>
            <label class="daily-field">地點（選填）<input name="location" id="plan-location" maxlength="60" placeholder="輸入地點"></label>
            <label class="plan-notes-field">備註（選填）<textarea name="notes" id="plan-notes" rows="3" maxlength="240" placeholder="補充計畫內容"></textarea></label>
            <div class="form-actions"><button class="primary-button submit-button" type="submit"><span id="submit-label">加入行程</span><span>→</span></button><button class="secondary-button" id="cancel-edit-button" type="button" hidden>取消修改</button></div>
          </form>
          <section class="saved-plans" aria-labelledby="saved-plans-heading"><h3 id="saved-plans-heading">已儲存計畫</h3><div id="plan-list" class="plan-list"></div></section>
        </section>
        <footer class="footer-note">把重要的事，安排進生活。 <span>✳</span></footer>
      </div>
    </main>
  </div>

  <dialog class="app-dialog" id="plan-dialog">
    <div class="dialog-top"><span id="dialog-type" class="dialog-kicker">行程</span><button class="dialog-close" type="button" data-close-dialog="plan-dialog" aria-label="關閉">×</button></div>
    <h2 id="dialog-title"></h2>
    <p id="dialog-date" class="dialog-date"></p>
    <p id="dialog-time" class="dialog-time"></p>
    <p id="dialog-location" class="dialog-detail"></p>
    <p id="dialog-notes" class="dialog-detail"></p>
    <div class="dialog-actions"><button class="secondary-button" id="toggle-complete-button" type="button" hidden>標記完成</button><button class="danger-button" id="delete-plan-button" type="button">刪除</button><button class="primary-button" id="edit-plan-button" type="button">更改</button></div>
  </dialog>

  <dialog class="app-dialog title-dialog" id="title-dialog">
    <form id="title-form">
      <div class="dialog-top"><span id="title-dialog-heading" class="dialog-kicker">行事曆名稱</span><button class="dialog-close" type="button" data-close-dialog="title-dialog" aria-label="關閉">×</button></div>
      <p id="title-dialog-hint" class="dialog-detail">設定一個你喜歡的行事曆名稱。</p>
      <label>自訂名稱<input id="title-input" maxlength="40" placeholder="例如：我的行事曆"></label>
      <div class="dialog-actions"><button class="secondary-button" type="button" data-close-dialog="title-dialog">取消</button><button id="title-submit-label" class="primary-button" type="submit">開始使用</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="calendar-app.js"></script>
</body>
</html>
